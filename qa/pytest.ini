[pytest]
testpaths = web cli tui mobile_web desktop
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    smoke: smoke tests (must pass before merge)
    web: browser-based tests against the SPA
    cli: CLI subprocess tests (claytab binary)
    tui: TUI tests driven via pexpect
    mobile_web: tests against the Expo web build of the mobile app
    desktop: tests targeting the Tauri desktop app or its bundled frontend
    api: backend API tests (no browser)
    seo: SEO-related tests
    mobile: mobile-viewport (browser) tests
    needs_android_sdk: requires Android SDK + emulator (skipped by default)
    needs_xvfb: requires Xvfb + Tauri runtime libs (skipped headless)
