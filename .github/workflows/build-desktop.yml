name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: ClayTablet ${{ github.ref_name }}
          releaseBody: |
            ## ClayTablet Desktop ${{ github.ref_name }}

            ### Скачать
            | Платформа | Файл |
            |-----------|------|
            | Windows | `.msi` или `_x64-setup.exe` |
            | Linux | `.AppImage` или `.deb` |
            | macOS (Apple Silicon) | `.dmg` |

            ### Первый запуск
            - **Windows:** запусти `.msi`, при предупреждении SmartScreen → "Подробнее" → "Выполнить"
            - **Linux:** `chmod +x ClayTablet.AppImage && ./ClayTablet.AppImage`
            - **macOS:** перетащи `.app` в Applications

            ### Настройка
            В Settings укажи сервер: `https://claytablet.online` или свой self-hosted
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
